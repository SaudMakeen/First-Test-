<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
<style>

.top-bar {
    position: fixed;
    top: 20px;
    right: 30px;
    z-index: 1000;
}

.logout-btn {

    background: rgba(255,255,255,0.2);

    color: white;

    border: 1px solid rgba(255,255,255,0.4);

    padding: 12px 20px;

    border-radius: 12px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.logout-btn:hover {

    background: linear-gradient(135deg, #800020 0%, #20c6c7 100%);
    color: white;
    transform: translateY(-2px);
}

.logout-btn:active {

    transform: scale(0.95);
}

   body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #b7d600 0%,
        #57c84d 35%,
        #20c6c7 100%
    );

    padding: 50px;
}

h1 {

    text-align: center;

    color: white;

    margin-bottom: 10px;
}

p {

    text-align: center;

    color: black;

    margin-bottom: 40px;
}

.services-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    justify-content: center;
    gap: 25px;

    max-width: 1000px;

    margin: auto;
}

.card {

    background: white;
    width: 200px;
    border-radius: 20px;
    height: 50px;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .info-box {
        width: 400px;
        padding: 20px;
        border-radius: 20px;
        background: white;
        margin: 30px auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        background: white;
        max-width: 600px;

    }

.card:hover {

    transform: translateY(-8px);
    background: linear-gradient(135deg, #800020 0%, #20c6c7 100%);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.icon {

    font-size: 20px;

    margin-bottom: 15px;
}

.title {

    font-size: 15px;
    font-weight: bold;
    color: #444;
}

.card:hover .title{
    color: white;

}
</style>
</head>

<body>

<div class="top-bar">
    <button class="logout-btn"
            onclick="window.location.href='/logout'">
        Sign Out
    </button>

</div>

<h1>Welcome {{ username }} 👋</h1>
<p>Select a service</p>

<div class="services-grid">
    {% for service in services %}

<div class="card" onclick="openService('{{ service }}')">

    <div class="icon">⚡</div>

    <div class="title">
        {{ service }}
    </div>

</div>

{% endfor %}

</div>
<div id="whoami-box" class="info-box" style="display:none;">
</div>

</body>
<script>

async function showWhoAmI() {

    const response = await fetch("/whoami");

    const data = await response.json();

    document.getElementById("whoami-box").innerHTML = `
    <h3>Who Am I</h3>
    <h3><b>Username:</b> ${data.username}</h3>
    <h3><b>Password:</b> ${data.password}</h3>
`;

    document.getElementById("whoami-box").style.display = "block";
}
async function showWhoAmI2() {

    const response = await fetch("/whoami");

    const data = await response.json();

    document.getElementById("whoami-box").innerHTML = `
    <h3>Who you are</h3>
    <h3><b>Username:</b> ${data.username}</h3>
    <h3><b>Password:</b> ${data.password}</h3>
`;

    document.getElementById("whoami-box").style.display = "block";
}
</script>

<script>

function openService(service) {

    if (service === "Who I Am") {
        showWhoAmI();
    }

    else if (service === "Who you are") {
        showWhoAmI2();
    }

    else if (service === "Network Health Check") {
        alert("Network Health Check");
    }

    else if (service === "Generate Report") {
        alert("Generate Report");
    }

    else if (service === "Contact Support") {
        alert("Contact Support");
    }

}

</script>
</html>
