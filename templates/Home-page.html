<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
<style>

.top-bar {
    position: fixed;
    top: 20px;
    right: 30px;
    z-index: 1000;
}

.logout-btn {

    background: rgba(255,255,255,0.2);

    color: white;

    border: 1px solid rgba(255,255,255,0.4);

    padding: 12px 20px;

    border-radius: 12px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.logout-btn:hover {

    background: linear-gradient(135deg, #800020 0%, #20c6c7 100%);

    color: white;

    transform: translateY(-2px);
}

.logout-btn:active {

    transform: scale(0.95);
}

   body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #b7d600 0%,
        #57c84d 35%,
        #20c6c7 100%
    );

    padding: 50px;
}

h1 {

    text-align: center;

    color: white;

    margin-bottom: 10px;
}

p {

    text-align: center;

    color: white;

    margin-bottom: 40px;
}

.services-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

    gap: 25px;

    max-width: 1200px;

    margin: auto;
}

.card {

    background: white;

    border-radius: 20px;

    padding: 35px;

    text-align: center;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.card:hover {

    transform: translateY(-8px);

    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.icon {

    font-size: 40px;

    margin-bottom: 15px;
}

.title {

    font-size: 18px;

    font-weight: bold;

    color: #444;
}
</style>
</head>

<body>

<div class="top-bar">
    <button class="logout-btn"
            onclick="window.location.href='/logout'">
        Sign Out
    </button>

</div>

<h1>Welcome {{ username }} 👋</h1>
<p>Select a service</p>

<div class="services-grid">

    {% for service in services %}

    <div class="card">
        <div class="icon">⚡</div>
        <div class="title">{{ service }}</div>
    </div>

    {% endfor %}

</div>


</body>

</html>
