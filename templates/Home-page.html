<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
<style>

.top-bar {

    position: fixed;
    height: 60px;
    top: 10px;

    right: 30px;

    z-index: 10000;
}

.logout-btn {

    background: linear-gradient(135deg, #800020 0%, #20c6c7 100%);

    color: white;

    border: 1px solid rgba(255,255,255,0.4);

    padding: 12px 20px;

    border-radius: 12px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: all 0.3s ease;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.logout-btn:hover {

    background: white;
    color: black;
    transform: translateY(-2px);
}

.logout-btn:active {

    transform: scale(0.95);
}

   body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #b7d600 0%,
        #57c84d 35%,
        #20c6c7 100%
    );

    padding: 50px;
}

h1 {

    text-align: center;

    color: white;

    margin-bottom: 10px;
}

p {

    text-align: center;

    color: black;

    margin-bottom: 40px;
}

.card {

    background: white;
    width: 200px;
    border-radius: 20px;
    height: 50px;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

.info-box {

    width: calc(100vw - 300px);

    min-width: 500px;

    margin-left: 180px;

    padding: 20px;

    border-radius: 20px;

    background: white;

    box-shadow: 0 10px 25px rgba(0,0,0,0.15);

    display: none;

    min-height: 300px;

    opacity: 0;

    transform: translateX(100px) scale(0.9);

    transition: all 0.7s ease;
}

.card:hover {

    transform: translateY(-8px);
    background: linear-gradient(135deg, #800020 0%, #20c6c7 100%);
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.icon {

    font-size: 20px;

    margin-bottom: 15px;
}

.title {

    font-size: 15px;
    font-weight: bold;
    color: #444;
}

.card:hover .title{
    color: white;

}

.main-container {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 40px;

    margin-top: 30px;

    transition: all 0.8s ease;
}

.services-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

    justify-content: center;

    gap: 15px;

    max-width: 1000px;
    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

    margin: auto;

}

.services-grid.fade {

    opacity: 0;

    transform: scale(0.95);
}
.services-grid.active {

    position: fixed;

    max-height: 80vh;
    left: 20px;

    top: 80px;

    width: 220px;

    display: flex;

    flex-direction: column;

    gap: 8px;

    animation: slideLeft 1.2s ease-in-out forwards;
}

.services-grid.active .card {

    width: 180px;
    height: auto;
    padding: 12px 20px;

    display: flex;

    align-items: center;

    gap: 10px;

}
.services-grid.active .title {

    font-size: 14px;
}
.services-grid.active .icon {

    font-size: 16px;

    margin-bottom: 0px;
}

.info-box.show {

    opacity: 1;

    transform: translateX(0) scale(1);
}
#headerSection {

    position: fixed;

    top: 75px;

    left: 20px;

    width: 300px;

    text-align: left;

    transition: opacity 0.8s ease,
                transform 0.8s ease;

    z-index: 5000;
}

#headerSection.hide {

    opacity: 0;

    transform: translateY(-80px);

    pointer-events: none;
}
 .header-bar {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 60px;

    background: rgba(255,255,255,0.25);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(255,255,255,0.2);

    z-index: 9999;
}

@keyframes slideLeft {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-20px);
    }
}

.card.selected {

    background: linear-gradient(
        135deg,
        #800020 0%,
        #20c6c7 100%
    );

    color: white;

    transform: translateX(10px);

    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

.card.selected .title {

    color: white;
}
.header-bar::after {

    content: "";

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    height: 3px;

}
</style>
</head>

<body>
<div class="header-bar"></div>

<div class="top-bar">
    <button class="logout-btn"
            onclick="window.location.href='/logout'">
        Sign Out
    </button>

</div>

<div id="headerSection">

    <h1>Welcome {{ username }} 👋</h1>

    <p>Select a service</p>

</div>

<div class="main-container">

    <div class="services-grid" id="servicesGrid">

        {% for service in services %}

        <div class="card" onclick="openService('{{ service }}', this)">

            <div class="icon">⚡</div>

            <div class="title">{{ service }}</div>

        </div>

        {% endfor %}

    </div>

    <div id="whoami-box" class="info-box">
</div>    </div>
<div class="header-bar">Home</div></div>
<div class="footer"> © 2026 Zain Saud Portal </div>


</body>
<script>

async function showWhoAmI() {

    const response = await fetch("/whoami");

    const data = await response.json();

    document.getElementById("whoami-box").innerHTML = `
    <h3>VPN Management</h3> `;

    document.getElementById("whoami-box").style.display = "block";
}
</script>

<script>
async function showWhoAmI2() {


    const response = await fetch("/whoami");

    const data = await response.json();

    document.getElementById("whoami-box").innerHTML = `
    <h3>LDAP Management</h3> `;
    document.getElementById("whoami-box").style.display = "block";
}
</script>

<script>

function openService(service, element) {

    const grid =
        document.getElementById("servicesGrid");

    // إزالة التحديد من جميع الكروت
    document.querySelectorAll(".card").forEach(card => {
        card.classList.remove("selected");
    });

    // تمييز الكرت المختار
    element.classList.add("selected");

    // تشغيل الأنيميشن أول مرة فقط
    if (!grid.classList.contains("active")) {

        document.getElementById("headerSection")
            .classList.add("hide");

        grid.classList.add("fade");

        setTimeout(() => {

            grid.classList.remove("fade");

            grid.classList.add("active");

        }, 1200);

        setTimeout(() => {

            document.getElementById("whoami-box")
                .style.display = "block";

            setTimeout(() => {

                document.getElementById("whoami-box")
                    .classList.add("show");

            }, 50);

        }, 1800);
    }

    // محتوى الخدمات

    if (service === "VPN Management") {

        showWhoAmI();

    }

    else if (service === "LDAP Management") {

        showWhoAmI2();

    }

    else if (service === "") {

    }

    else if (service === "") {

    }

    else if (service === "") {

        alert("Contact Support");

    }

}

</script>
</html>
